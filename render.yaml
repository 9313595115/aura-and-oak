# Render Blueprint for Aura & Oak — FREE plan.
# In Render: New → Blueprint → pick this repo → Apply.
#
# Render's free plan has no MySQL and no disks, so the database is hosted on
# alwaysdata (MariaDB) and you paste its connection details when asked.
# Free-plan limits: the site sleeps after 15 min idle (first visit then takes
# ~1 min), and images uploaded in the admin are lost on restart — put product
# photos in public/images in the repo instead.

services:
  - type: web
    name: aura-and-oak
    runtime: node
    plan: free
    # Frankfurt is closest to alwaysdata's servers in Paris (faster pages)
    region: frankfurt
    buildCommand: npm ci --omit=dev
    # db:setup is safe to re-run; it creates/upgrades tables, then the store starts
    startCommand: npm run db:setup && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # ── Database (alwaysdata → Databases → MySQL)
      - key: MYSQL_HOST
        value: mysql-root6597.alwaysdata.net
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        value: root6597
      # The password of the root6597 user on alwaysdata
      - key: MYSQL_PASSWORD
        sync: false
      # Existing alwaysdata database for this store
      - key: MYSQL_DATABASE
        value: root6597_wb
      # ── Secrets (generated by Render)
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      # Public address, e.g. https://aura-and-oak.onrender.com
      - key: BASE_URL
        sync: false
      - key: STORE_CURRENCY
        value: INR
      - key: STORE_LOCALE
        value: en-IN
      - key: STORE_DEFAULT_SHIP_COUNTRY
        value: India
      - key: STORE_COUNTRY
        value: IN
      # Your business details
      - key: STORE_EMAIL
        sync: false
      - key: STORE_PHONE
        sync: false
      - key: STORE_STREET
        sync: false
      - key: STORE_CITY
        sync: false
      - key: STORE_REGION
        sync: false
      - key: STORE_POSTAL_CODE
        sync: false
