<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#F9F6F0" />
  <title>Page not found — Aura & Oak</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/common.css" />
<!--SEO-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #F9F6F0; color: #2A2621; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
  nav { display: flex; justify-content: center; padding: 24px; border-bottom: 1px solid #E8E2D9; }
  .nav-logo { font-family: 'Playfair Display', Georgia, serif; font-size: 22px; font-weight: 600; text-decoration: none; color: inherit; }
  .nav-logo span { font-style: italic; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 80px 24px; }
  .code { font-family: 'Playfair Display', Georgia, serif; font-size: 96px; color: #E8E2D9; line-height: 1; }
  h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 32px; font-weight: 400; margin: 12px 0; }
  p { color: #6B6055; margin-bottom: 28px; max-width: 420px; }
  form { display: flex; gap: 8px; margin-bottom: 24px; width: 100%; max-width: 380px; }
  input { flex: 1; padding: 12px 14px; border: 1.5px solid #E8E2D9; border-radius: 4px; font-size: 14px; }
  .links { display: flex; gap: 20px; font-size: 14px; }
  .links a { color: #A04B37; text-decoration: underline; }
</style>
</head>
<body>
<nav><a href="/" class="nav-logo">Aura <span>&</span> Oak</a></nav>
<main>
  <div class="code">404</div>
  <h1>We couldn't find that page</h1>
  <p>The piece you're looking for may have sold out or moved. Try a search, or start from the shop.</p>
  <form action="/shop" method="get" role="search">
    <label for="q" class="sr-only">Search products</label>
    <input id="q" name="q" type="search" placeholder="Search products…" />
    <button class="btn-primary" type="submit">Search</button>
  </form>
  <div class="links"><a href="/shop">Shop all</a><a href="/">Home</a><a href="/contact">Contact us</a></div>
</main>
<script src="/js/common.js"></script>
</body>
</html>
