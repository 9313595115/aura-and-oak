<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="/images/brand/favicon-64.png" type="image/png" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#F7F3EE" />
  <title>Reset Password — Eagle CNC Art & Craft</title>
<meta name="robots" content="noindex" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/common.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #F7F3EE; color: #2E2419; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; line-height: 1.6; }
  a { color: inherit; }
  nav { display: flex; justify-content: center; padding: 24px; border-bottom: 1px solid #E6DFD6; }
  .nav-logo { font-family: 'Josefin Sans', Georgia, serif; font-size: 22px; font-weight: 600; text-decoration: none; }
  .nav-logo span { font-style: italic; }
  .wrap { max-width: 420px; margin: 0 auto; padding: 64px 24px; }
  h1 { font-family: 'Josefin Sans', Georgia, serif; font-size: 28px; font-weight: 500; margin-bottom: 8px; }
  .sub { color: #6B6055; font-size: 14px; margin-bottom: 24px; }
  label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: #6B6055; display: block; margin-bottom: 6px; }
  input { width: 100%; padding: 12px 14px; border: 1.5px solid #E6DFD6; border-radius: 4px; font-size: 14px; margin-bottom: 14px; }
  .msg { font-size: 13px; margin: -4px 0 14px; color: #6E5843; min-height: 18px; }
</style>
  <link rel="stylesheet" href="/css/responsive.css" />
  <link rel="stylesheet" href="/css/brand.css" />
</head>
<body>
<nav><a href="/" class="nav-logo brand-logo"><img src="/images/brand/eagle-logo-primary-640.png" alt="Eagle CNC Art &amp; Craft" width="640" height="182" /></a></nav>
<div class="wrap">
  <h1>Choose a new password</h1>
  <p class="sub">Pick something at least 8 characters long that you don't use elsewhere.</p>
  <form id="resetForm">
    <label for="pw1">New password</label><input type="password" id="pw1" autocomplete="new-password" minlength="8" required />
    <label for="pw2">Confirm password</label><input type="password" id="pw2" autocomplete="new-password" minlength="8" required />
    <p class="msg" id="msg" role="alert"></p>
    <button class="btn-primary" style="width:100%" type="submit">Save Password</button>
  </form>
  <p style="margin-top:20px;font-size:13px;text-align:center"><a href="account.html" style="color:#6E5843">Back to sign in</a></p>
</div>
<script src="/js/common.js"></script>
<script>
  const token = new URLSearchParams(location.search).get('token');
  if (!token) document.getElementById('msg').textContent = 'This link is missing its reset code. Please request a new one from the sign-in page.';
  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg'), a = document.getElementById('pw1').value, b = document.getElementById('pw2').value;
    if (a !== b) { msg.textContent = 'The two passwords don\'t match.'; return; }
    try {
      const r = await api('/api/auth/reset-password', { method: 'POST', body: JSON.stringify({ token, password: a }) });
      setAuth(r.token, r.user);
      showToastGlobal('Password updated — you\'re signed in');
      setTimeout(() => location.href = 'account.html', 900);
    } catch (err) { msg.textContent = err.message; }
  });
</script>
</body>
</html>
